server:
  port: 8080
spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:mysql://localhost:3306/AI_Learning?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${JDBC_DATABASE_USERNAME:root}
    password: ${JDBC_DATABASE_PASSWORD:NewStrongPass!123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
ai:
  provider: openai
  apiKey: ${OPENAI_API_KEY:}
